--- # kafka 配置
spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      linger: 1
      retries: 3
      batch-size: 256
      buffer-memory: 33554432
    consumer:
      enable-auto-commit: false
      auto-commit-interval: 100
      auto-offset-reset: earliest
      group-id: default-group
      max-poll-records: 50
      concurrency: 9
      maxPollRecordsConfig: 50
      session-timeout: 15000

