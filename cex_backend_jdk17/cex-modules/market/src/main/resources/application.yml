########################################
# hawk netty 核心配置
########################################
aqmd:
  netty:
    # Netty TCP 服务监听端口
    port: 28901
    # 负责处理客户端 TCP 连接请求的 Boss 线程数，建议设为 1
    boss-thread-size: 1
    # I/O 读写线程数，建议范围：1 < N < CPU核心数 * 2
    worker-thread-size: 3
    # 自定义协议包头中表示“包长度”字段所占字节数（通常为 4 字节 int）
    packet-header-length: 4
    # 数据包最大允许长度（字节），超过将抛出 TooLongFrameException
    # 注意：2147483647 ≈ 2GB，生产环境建议限制为合理值（如 10MB = 10485760）
    max-frame-length: 2147483647
    # 写空闲超时时间（秒）：若服务端在此时间内未向客户端发送任何数据，则触发空闲事件（常用于心跳检测）
    writer-idle: 200
    # 单个业务请求的最大超时时间（秒），防止长时间阻塞
    max-timeout: 60
    # 业务请求的默认超时时间（秒），若具体命令未指定超时则使用此值
    default-timeout: 30
    # 业务逻辑处理线程池大小（用于执行非 I/O 的业务代码，如查库、计算等）
    deal-handler-thread-size: 10
    # Netty 内部服务日志级别（可选：trace/debug/info/warn/error）
    # 开发环境可用 debug，生产环境建议 info 或 warn
    service-logger-level: debug
    # 是否开启未登录直接访问功能（1=开启，0=关闭）
    direct-access-flag: 1
    # 允许未登录用户直接访问的命令 ID 列表（逗号分隔）
    # 示例：20001=登录，20021=订阅行情，20022=获取市场快照
    direct-access-command: "20001,20002,20021,20022"
    # 是否启用 WebSocket 支持（1=启用，0=仅支持原生 TCP）
    websocket-flag: 1
    # WebSocket 服务监听端口（与 TCP 端口分离，便于前端连接）
    websocket-port: 28985
