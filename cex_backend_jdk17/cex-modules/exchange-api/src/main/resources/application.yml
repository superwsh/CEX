    sql: info
--- # 数据库 配置
spring:
  main:
    allow-circular-references: true # 允许循环依赖（Spring Boot 3.x 默认 false）
  # redis通用配置 子服务可以自行配置进行覆盖
  data:
    redis:
      host: redis
      port: 6379
      # redis 密码必须配置
      password: Magician8421
      database: 11
      timeout: 10000
      ssl.enabled: false
    mongodb:
      uri: mongodb://admin:admin123@mongo:27017/bizzan?authSource=admin
      database: bitrade
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    url: jdbc:mysql://${MYSQL_HOST:mysql-db}:${MYSQL_PORT:3306}/${MYSQL_DB:cloud_biz}?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowMultiQueries=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
