--- # kafka 配置
spring:
  kafka:
    bootstrap-servers: 212.129.154.147:9092
    producer:
      linger: 1
      retries: 0
      batch-size: 256
      buffer-memory: 1048576
    consumer:
      enable-auto-commit: false
      auto-commit-interval: 100
      auto-offset-reset: earliest
      group-id: default-group
      max-poll-records: 50

