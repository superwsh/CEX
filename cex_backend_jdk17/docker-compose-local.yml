services:
  wallet-core:
    build:
      context: .
      dockerfile: Dockerfile.wallet.core
    ports:
      - "6009:6009"
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  wallet-eth:
    build:
      context: .
      dockerfile: Dockerfile.wallet.eth
    ports:
      - "7003:7003"
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  wallet-eusdt:
    build:
      context: .
      dockerfile: Dockerfile.wallet.eusdt
    ports:
      - "7004:7004"
    depends_on:
      wallet-core:
        condition: service_started
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    mem_limit: 256m

networks:
  app-network:
    driver: bridge
volumes:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local
