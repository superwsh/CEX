services:
  mysql-db:
    container_name: bizzan-mysql
    #    image: mysql:8.0.34
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0
    platform: linux/amd64
    restart: always
    volumes:
      - ./sql/my.conf:/etc/my.conf
      - ./sql/init:/docker-entrypoint-initdb.d/
      - ./sql/data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      # MYSQL_DATABASE: bizzan
      MYSQL_LOWER_CASE_TABLE_NAMES: 1
    # 👇 MySQL 健康检查
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p123456",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # 新增 Redis 服务
  redis:
    #    image: redis:7.2-alpine
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.1
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass Magician8421 # 使ls
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:5.0
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    restart: unless-stopped
    networks:
      - app-network

  zookeeper:
    image: bitnamilegacy/zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes # 允许匿名访问
    volumes:
      - "zookeeper_data:/bitnami"
    networks:
      - app-network

  kafka:
    image: bitnamilegacy/kafka:3.4
    container_name: kafka
    ports:
      - "9092:9092" # Kafka 服务端口
      - "9093:9093" # 备用端口（可选）
    environment:
      - KAFKA_CFG_BROKER_ID=1 # 固定 broker ID，防止重启后 ID 漂移
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes # 允许明文连接
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 # 客户端连接地址
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true # 自动创建主题
      # === 单节点部署必须的副本因子配置 ===
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1 # 默认副本因子（单节点必须为 1）
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1 # 内部 __consumer_offsets 副本因子
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 # 事务状态日志副本因子
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1 # 事务状态最小 ISR
      - KAFKA_CFG_NUM_PARTITIONS=1 # 默认分区数

      # 精简日志级别配置
      - KAFKA_LOG4J_ROOT_LOGLEVEL=WARN
      - KAFKA_LOG4J_LOGGERS=org.apache.kafka.clients.producer=INFO,org.apache.kafka.clients.consumer=INFO,kafka.producer=INFO,kafka.consumer=INFO,kafka.server.ReplicaManager=INFO
    volumes:
      - "kafka_data:/bitnami"
      - ./custom-log4j.properties:/opt/bitnami/kafka/config/log4j.properties
    depends_on:
      - zookeeper
    networks:
      - app-network

  #  kafka:
  #    build:
  #      context: .
  #      dockerfile: Dockerfile.kafka
  #    ports:
  #      - "9092:9092"
  #      - "9093:9093"
  #    networks:
  #      - app-network

  cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - app-network
    depends_on:
      #      - mysql-db
      mysql-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-u",
          "admin:123456",
          "http://localhost:8848/nacos/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12 # 最多等待 12 * 10 = 120 秒
      start_period: 30s # 给 Nacos 30 秒启动时间
    mem_limit: 512m

  uc:
    build:
      context: .
      dockerfile: Dockerfile.uc
    ports:
      - "6001:6001"
    depends_on:
      cloud:
        condition: service_healthy
      redis:
        condition: service_started
      mysql-db:
        condition: service_healthy
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    mem_limit: 500m

  exchangeapi:
    build:
      context: .
      dockerfile: Dockerfile.exchangeapi
    ports:
      - "6003:6003"
    depends_on:
      cloud:
        condition: service_healthy
      market:
        condition: service_started
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    mem_limit: 600m

  exchange:
    build:
      context: .
      dockerfile: Dockerfile.exchange
    ports:
      - "6005:6005"
    depends_on:
      cloud:
        condition: service_healthy
      market:
        condition: service_started
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    mem_limit: 600m

  market:
    build:
      context: .
      dockerfile: Dockerfile.market
    ports:
      - "6004:6004"
    depends_on:
      cloud:
        condition: service_healthy
      uc:
        condition: service_started
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    mem_limit: 1024m

  wallet-core:
    build:
      context: .
      dockerfile: Dockerfile.wallet.core
    ports:
      - "6009:6009"
    depends_on:
      cloud:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  wallet-eth:
    build:
      context: .
      dockerfile: Dockerfile.wallet.eth
    ports:
      - "7003:7003"
    depends_on:
      cloud:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  wallet-eusdt:
    build:
      context: .
      dockerfile: Dockerfile.wallet.eusdt
    ports:
      - "7004:7004"
    depends_on:
      cloud:
        condition: service_healthy
      wallet-core:
        condition: service_started
    extra_hosts: # 添加这一部分，让容器能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    mem_limit: 256m

networks:
  app-network:
    driver: bridge
volumes:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local
