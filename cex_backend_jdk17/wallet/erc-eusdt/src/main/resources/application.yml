server:
  port: 7004
  servlet:
    context-path: /usdt

spring:
  application:
    name: service-rpc-usdt
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: ${NACOS_HOST:cloud}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:cex}
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${spring.cloud.nacos.discovery.namespace}
  config:
    import:
      - nacos:application-common.yml
#      - nacos:${spring.application.name}.yml

--- # 数据库 配置
spring:
  main:
    allow-circular-references: true # 允许循环依赖（Spring Boot 3.x 默认 false）
  # redis通用配置 子服务可以自行配置进行覆盖
  data:
#    redis:
#      host: 39.98.78.102
#      port: 9531
#      # redis 密码必须配置
#      password: iiisct#2025
#      database: 11
#      timeout: 10000
#      ssl.enabled: false
    # spring.data.mongodb.uri
    mongodb:
      uri: mongodb://admin:admin123@mongo:27017/wallet?authSource=admin
--- # kafka 配置
spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      batch-size: 1000
    consumer:
      group-id: default-group
    template:
      default-topic: test
    listener:
      concurrency: 1

# 币种基本信息配置
coin:
  # 节点 RPC 地址（Docker 环境中 host.docker.internal 指向宿主机）
#  rpc: http://host.docker.internal:8545
  rpc: http://host.docker.internal:8545
  # 币种名称（用于显示或标识）
  name: USDT
  # 币种单位符号
  unit: USDT
  # 钱包 Keystore 文件存储路径
  keystore-path: wallet-data/ETH/keystore
#  keystore-path: /www/wallet-data/ETH/keystore
  # 默认转账最大 Gas Limit（默认值为 5 万）
  gas-limit: 50000
  # 提币专用钱包文件名（UTC--...json 格式）
  withdraw-wallet: UTC--2025-08-30T05-14-13.559000000Z--260db3aa6b460505e25702ea0129af01a6306b59.json
  # 提币钱包密码
  withdraw-wallet-password: c2ewithdraweth
  # 最小归集金额（低于此值不触发归集）
  min-collect-amount: 3

# 合约配置信息
contract:
  # 合约地址（示例：EUSDT 测试代币）
  address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
  # 合约精度单位（根据合约 decimals 值选择对应单位名称）
  # 单位与小数位对照：
  #   wei: 0, kwei: 3, wwei: 4, mwei: 6,
  #   gwei: 9, szabo: 12, finney: 15, ether: 18,
  #   kether: 21, mether: 24, gether: 27
  decimals: mwei
  # 合约转账交易的 Gas Limit（建议根据实际调用情况调整）
  gas-limit: 500000
  # Etherscan 事件日志监听所需的 topic0（通常为 Transfer 事件的 keccak256 哈希）
  # 获取方式：在 Etherscan 上搜索该合约，打开任意一笔交易，切换到 Event Logs Tab 查看
  event-topic0: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a1128f55a4df523b3ef"


# Etherscan API 配置
etherscan:
  # Etherscan API 密钥（需在 https://etherscan.io/myapikey 申请）
  token: BYFVKAANT5JVQPURWJMUAEUFCKGZ56P68


# 区块监听器（Watcher）配置
watcher:
  # 首次运行时开始扫描的区块高度（0 表示从创世块开始；生产环境建议设为合约部署区块或最新区块）
  init-block-height: 0
  # 每次扫描的区块步长（即一次查询多少个连续区块的日志）
  step: 5
  # 交易确认所需区块数（用于防止链分叉导致的交易回滚，通常设为 2~12）
  confirmation: 2
  # 区块同步轮询间隔（单位：毫秒），当前设置为 20 秒
  interval: 20000
